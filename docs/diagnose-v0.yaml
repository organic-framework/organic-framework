# The anti-pattern catalogue as data: the single source of thresholds, priors and inputs.
# Read by the rules in bin/of_diagnose_rules.py (of_field-analyst) and the run in bin/of_diagnose.py (of_studio);
# cited by docs/diagnose.md. Owner of this file: of_field-analyst.
# Every threshold is a hypothesis, to be confirmed in the Lab (lab-drift-v0) and by owner labels.
# A threshold change bumps that rule's `version`; both versions may run side by side for one window.
# Organization overrides come later through the structure policy file (RFC 0001 §6).
#
# labels_carry_from: earlier versions whose owner labels still apply. Set it only when a bump leaves detection
# unchanged (priors, remedies, deciders); a bump that changes detection starts with no labels.
#
# needs: inputs a rule reads. If any is empty in the window, the rule reports `blocked: no <input>` and raises
# nothing. Names: event kinds (of.*), registry paths (registry.*), derived fields (wr.position = work records
# attributed to a position, with `attributed_share_min` below), and external documents (stakeholder_map).
# Registry position keys: mandate_exit {done_when, review}, mandate_functions [...] (registry.md, e152e3d).
#
# severity: low | medium | high | critical, per rule or per part (default medium). Escalations take severity >= high;
# critical also bypasses the ranking. Chronic organization-wide conditions (owner-router) stay medium: they are
# ranked, not pushed. High is for risk that needs a decision soon (an uncovered function, work no keeper answers for).

catalogue: diagnose-v0
defaults:
  window_days: 7               # rolling window, evaluated daily
  trend_last_days: 3           # "rising": positive slope and the last N days above the window median
  flat_tolerance: 0.20         # "flat": slope within ±20% of the window mean per week
  minutes_per_prompt: 1.5      # owner minutes per prompt until focus events give real minutes
  attributed_share_min: 0.50   # rules that need authors are blocked below this share of attributed work records
  observed_days_gte: 3         # a position counts as observed only with hook or import activity (not source `of`) on >= N distinct days
                               # of the window; rules that reason from absent or few messages consider observed positions only
  exclude_bot_authors: true    # dependency bots and merge-queue apps are not writers
  label_fp_window: 20          # owner labels considered per rule
  label_fp_demote_share: 0.30  # above this false-positive share a rule is shown on request only
  critical_placement: top      # critical issues go above "waiting on you" and bypass the ranking
  severity: medium

rules:
  owner-router:
    version: 1                   # v1 (2026-11-15): decided by the structure keeper (diagnose.md §1, Who decides)
    labels_carry_from: [0]       # v1 changes only the decider
    decider: unit_owner_or_structure_keeper   # of_architect, 2026-11-15 (relay msg 01a1dc76-ed6e): the structure keeper, or the unit owner inside a delegated unit (of_diagnose.EITHER)
    p: 0.6
    m_decide: 5
    thresholds: {plumbing_share_gt: 0.05, in_degree_share_gt: 0.25, l_rising_lambda_flat: true}
    needs: [of.human_prompt, of.agent_question, of.agent_message_out]
    delta_m: "plumbing prompts in window x minutes_per_prompt x 0.5 (half removed by grants and batching)"
    remedies: [standing grant for repeated approval classes, coordinator for one routing cluster, batched asks with expected dT]

  owner-relay:
    version: 1                   # v1 (2026-11-06): owner words = fa `relayed`, >= 10% of the pair's messages, non-coordinator senders (first user organization's history: 12 pairs -> 4)
    p: 0.7
    m_decide: 5
    thresholds: {pair_owner_relays_gte: 3, pair_owner_words_gte: 5, pair_owner_words_share_gte: 0.10, owner_words_label: "fa-2026-11-05:relayed", exclude_sender_kinds: [coordinator], exclude_pair_kinds: [owner]}
    needs: [of.human_prompt, of.agent_message_out]   # paste_source on relay_paste prompts (derive, new) completes the relay half
    delta_m: "owner relays on the pair x minutes_per_prompt"
    remedies: [direct interface and grant between the pair, merge if over-coupled]

  coordination-gap:
    version: 2                   # v2 (2026-11-15): decided by the structure keeper (diagnose.md §1, Who decides); v1 (2026-11-06): an edge is judged unmet only when both keepers are observed (of_studio)
    labels_carry_from: [1]       # v2 changes only the decider
    decider: unit_owner_or_structure_keeper   # of_architect, 2026-11-15 (relay msg 01a1dc76-ed6e): the structure keeper, or the unit owner inside a delegated unit (of_diagnose.EITHER)
    p: 0.5
    m_decide: 3
    thresholds: {co_changed_wr_gte: 3, unmet_days: 7, observed_days_gte: 3}
    needs: [of.work_record, registry.systems.depends_on, registry.systems.keeper, of.agent_message_out]
    delta_m: "0 (no owner time; ranks by integration risk once incident rates exist)"
    remedies: [announce rule on the interface, move the seam]

  over-coupled:
    version: 5                   # v5 (2026-11-23): p from the deciders' labels (diagnose.md §5.2); v4 (2026-11-15): relay-era recalibration, the ratio stays 3 and a pair needs 3 merged PRs (diagnose.md 2.4); v3 (2026-11-10): decided by the structure keeper; v2 (2026-11-10): no pair with a unit owner (kind owner) or the structure keeper; v1 (2026-11-06): waits recorded per pair
    labels_carry_from: [0, 1, 2, 3, 4] # v2 and v4 only narrow what fires; v3 changes only the decider; v5 only priors
    decider: structure_keeper    # of_architect, 2026-11-10: its remedies are structure diffs; through of_platform's daily keeper digest
    p: 0.95   # 2026-11-23: 26 of 26 distinct labelled judgements true, held under certainty (diagnose.md §5.2); was 0.5
    m_decide: 15
    thresholds: {interface_ratio_gte: 3, reciprocity_gte: 0.5, reciprocity_without_waits_gte: 0.8, mutual_waits_gte: 1, observed_days_gte: 3, waits_recorded: per_pair,
                 exclude_pair_kinds: [owner], exclude_structure_keeper: true, pair_merged_prs_gte: 3}
    needs: [of.agent_message_out, of.work_record, wr.position]
    delta_m: "owner prompts relayed between the pair x minutes_per_prompt"
    remedies: [merge if the working set fits one holder, publish the interface]

  context-overload:
    version: 1                   # built 2026-11-14 on of.founder_correction (of.correction was never recorded; diagnose.md 2.5)
                                 # v1 (2026-11-23): marks the remedies changed under @0 in organic-framework PR 377
    labels_carry_from: [0]       # v1 changes only remedies
    p: 0.5
    m_decide: 10
    thresholds: {compactions_per_active_day_gte: 4, median_multiple_gte: 3, forgotten_fact_errors_gte: 2, after_compaction_hours: 2}
    needs: [of.compaction, of.founder_correction]   # a correction counts when its kind is fact or it repeats an earlier one
    decider: structure_keeper    # it sets where the position's reading runs (its brief) and a split (as chatty@2)
    delta_m: "owner re-explain prompts after compactions x minutes_per_prompt"
    remedies: [keep the context and move its reading to subagents and other harnesses, split at a seam]   # no fresh holder: the founder, 2026-11-18, prompt 01a1eeff-880b

  fragmented-ownership:
    version: 1                   # v1 (2026-11-06): a code window counts only if the same keeper held the system at its start
    p: {runtime: 0.7, code: 0.4}
    m_decide: 3
    thresholds: {runtime_nonkeeper_writes_gte: 1, code_writers_gte: 3, keeper_share_lt: 0.30, consecutive_windows: 2, keeper_held_at_window_start: true}
    critical: runtime
    severity: {runtime: critical, code: medium}
    needs: {runtime: [of.deployment, registry.systems.keeper], code: [of.work_record, wr.position, registry.systems.keeper]}
    delta_m: "0 for code; runtime is critical"
    remedies: [hand writes to the system agent, route changes through the keeper's review]

  orphan-work:
    version: 5                   # v5 (2026-11-23): p from the deciders' labels (diagnose.md §5.2); v4 (2026-11-15): the cluster part is decided by the structure keeper (diagnose.md §1, Who decides); v3 (2026-11-10): keeperless moves to unkept-system (2.23), which flags a live system nobody keeps with or without work; v2 (2026-11-07): keeperless only on live systems kept by nobody
    labels_carry_from: [0, 1, 2, 3, 4] # v1 left detection unchanged; v2 narrowed keeperless; v3 drops it; v4 changes only a decider; v5 only priors
    p: 0.6   # 2026-11-23: 6 of 10 distinct labelled judgements true; the labels name no part (diagnose.md §5.2); was {cluster: 0.6, unmapped: 0.8}
    m_decide: {cluster: 10, unmapped: 3}
    thresholds: {unowned_verdicts_per_cluster_gte: 3, unmapped_wr_share_gte: 0.05, cluster_exclude_paths: [/tmp, /private/tmp, $TMPDIR, '*/scratchpad/*'], merge_into: unkept-system}   # a cluster on a system nobody keeps is evidence on that system's issue
    cluster_from_router: rt-v4   # input rule (2026-11-07, of_studio 13b781f): earlier routers judged linked worktrees unowned
    needs: {cluster: [of.mandate_check], unmapped: [of.work_record]}
    decider: {cluster: unit_owner_or_structure_keeper, unmapped: structure_keeper}   # cluster: of_architect, 2026-11-15 (relay msg 01a1dc76-ed6e): the structure keeper, or the unit owner inside a delegated unit (of_diagnose.EITHER)
    severity: {cluster: medium, unmapped: low}
    delta_m: "0 (ranks by risk); a new position costs the owner one decision"
    remedies:
      cluster: [new position with a brief draft, extend the nearest mandate]
      unmapped: [extend the systems map (paths or a new system)]

  bottleneck-broker:
    version: 1                   # v1 (2026-11-06): betweenness on strong ties (>= 5 msgs), inbound 0.15, coordinators and the structure keeper excluded
    p: 0.5
    m_decide: 15
    thresholds: {inbound_share_gte: 0.15, betweenness_gte: 0.20, strong_tie_msgs_gte: 5, wait_spike_multiple_gte: 2, observed_days_gte: 3, exclude_kinds: [coordinator], exclude_structure_keeper: true}
    needs: [of.agent_message_out, of.agent_message_in]   # of.state_changed(blocked_on) enables the wait-spike half
    delta_m: "owner prompts routed through the broker x minutes_per_prompt"
    remedies: [deputy or published interface for its most frequent request, split its interfaces]

  missing-verifier:
    version: 2                   # v2 (2026-11-15): part results reads verdict comments as review evidence (diagnose.md 2.9); v1 (2026-11-14): part answers, a position with no merged work against the owner's prompts (mandate 5); v0 (2026-11-14): built on of.founder_correction (of.correction was never recorded)
    labels_carry_from: [1]       # part answers is unchanged (its own issue ids); part results now reads more review evidence
    p: 0.6
    m_decide: 5
    thresholds: {rework_per_wr_gte: 0.20, corrections_gte: 3, correction_kinds: [output, fact],
                 answers_corrections_per_prompt_gte: 0.05}   # a hypothesis from the first week (of_conductor 0.08), for the structure keeper's labels
    needs:                       # work-record relations (reverts, fixes) will add code rework; answers needs the work records to know a position merged none
      results: [of.founder_correction, of.work_record, wr.position]
      answers: [of.founder_correction, of.human_prompt, of.work_record, wr.position]
    decider: structure_keeper    # its remedies, a review step or a verifier position, are structure changes (as chatty@2)
    delta_m: "owner correction prompts on the position x minutes_per_prompt"
    remedies:
      results: [cross-model review before results reach the owner or production, verifier position]
      answers: ["a check before an answer reaches the owner: a second model reads it against its sources, and where each reading in it was taken", verifier position for the class of answers]

  chatty:
    version: 5                   # v5 (2026-11-24): p from the deciders' labels (diagnose.md §5.2); v4 (2026-11-15): from labels: no pair of a unit owner and its own unit's position; no nudges from of pulse itself; a coordinator's pairs and waits get a booking remedy (diagnose.md 2.10); v3 (2026-11-14): the pair part needs pair_merged_prs_gte merged PRs; v2 (2026-11-10): decided by the structure keeper; v1 (2026-11-07): the receiver's side, parts receiver_flood and repeat_nudges (of_studio b8242dd); counts only ended days whose merged PRs are imported (as churn)
    labels_carry_from: [0, 1, 2, 3, 4] # v1 kept the organization and pair parts' issue ids; v2 changes only the decider; v3 and v4 only narrow what fires (v4 also changes a remedy); v5 only priors
    decider: structure_keeper    # of_architect, 2026-11-10: its remedies are structure diffs; through of_platform's daily keeper digest
    p: 0.9    # 2026-11-23: 26 of 29 distinct labelled judgements true, across two organizations (diagnose.md §5.2); was 0.91
    m_decide: 5
    thresholds: {org_msgs_per_wr_rise_gte: 0.50, pair_msgs_per_wr_gte: 10, pair_merged_prs_gte: 3, exclude_unit_owner_with_own_unit: true, unused_after_hours: 24, observed_days_gte: 3,
                 injected_turns_per_hour_gte: 20, flood_hours_gte: 3, nudges_per_pair_gte: 10}
    needs: {default: [of.agent_message_out, of.work_record, wr.position], receiver_flood: [of.agent_message_in], repeat_nudges: [of.human_prompt]}   # parts run on their own inputs (of_studio 44d4852)
    # default reads attributed merged PRs: without wr.position every busy pair has 0 PRs and fires (first user organization, 2026-11-10: 133)
    delta_m: "0 (frees holders, not the owner)"
    remedies:                    # `default`: the organization and pair parts (issues without a part; of_studio 44d4852)
      default: ["published interface: a booking tool, a status surface or a queue the coordinator reads"]
      receiver_flood: [batched delivery or a queue read between tasks, published interface for the top senders, split the receiver's interfaces]
      repeat_nudges: [a hand-over instead of nudges, escalate to the owner of both]   # no invented deadlines (founder, ask 53628150)
      coordinator: ["a booking tool or queue for <coordinator>'s shared capacity, so a slot is booked and released without a message", "positions stop copying notices to <coordinator> unless it must act"]   # v4: a pair or a wait with a coordinator (kind coordinator); the first user organization's wrong_remedy labels, 2026-11-15

  unclear-mandate:
    version: 4                   # v4 (2026-11-15): decided by the structure keeper (diagnose.md §1, Who decides); v3 (2026-11-15): no brief revision counts (diagnose.md 2.11); v2 (2026-11-15): organization-wide brief edits left out; v1 (2026-11-06): substantive changes only (throughput, brief, done_when from non-empty, done -> active); settle_days after the first snapshot
    labels_carry_from: [1, 2, 3] # v2 and v3 only narrow what fires; v4 changes only the decider
    decider: unit_owner_or_structure_keeper   # of_architect, 2026-11-15 (relay msg 01a1dc76-ed6e): the structure keeper, or the unit owner inside a delegated unit (of_diagnose.EITHER)
    p: 0.5
    m_decide: 10
    thresholds: {mandate_changes_gte: 2, wrong_priority_or_overengineered_verdicts_gte: 3, spec_failure_share_gte: 0.20, settle_days: 3, substantive_fields: [throughput, mandate_exit.done_when, status_reopened], ignore_added_fields: true}
    needs: [of.mandate_changed]   # verdict reason_class and MAST tags add signals when present
    delta_m: "owner corrections on the position x minutes_per_prompt"
    remedies: [rewrite the brief with done criteria, split if two jobs share one position]

  function-gap:
    version: 2                   # v2 (2026-11-23): p from the deciders' labels (diagnose.md §5.2); v1 (2026-11-15): decided by the structure keeper (diagnose.md §1, Who decides)
    labels_carry_from: [0, 1]    # v1 changes only the decider; v2 only priors
    decider: unit_owner_or_structure_keeper   # of_architect, 2026-11-15 (relay msg 01a1dc76-ed6e): the structure keeper, or the unit owner inside a delegated unit (of_diagnose.EITHER)
    p: 0.8   # 2026-11-23: 4 of 5 distinct labelled judgements true, across two organizations (diagnose.md §5.2); was 0.7
    m_decide: 20
    thresholds: {uncovered_function_with_dependent_interest: true}
    critical: right_to_operate     # an uncovered function that a right-to-operate interest depends on
    severity: {default: medium, dependent_interest: high}   # high when the stakeholder map lists a dependent interest; critical for the right to operate
    needs: [registry.mandate_functions]   # stakeholder_map (data, later) raises severity to critical; without it the gap is ranked, not critical
    delta_m: "0 (risk; critical when it touches the right to operate)"
    remedies: [new position, often a process keeper, external organization with an interface]

  churn:
    version: 0
    p: 0.6
    m_decide: 5
    thresholds: {changes_per_position_gte: 2, share_of_positions_one_day_gte: 0.50, wr_drop_gte: 0.50}
    needs: [of.work_record, of.holder_changed, of.mandate_changed]   # of.state_declared(suspended) adds account moves
    delta_m: "0 (ranks by the measured throughput dip once T exists)"
    remedies: [freeze structure changes, lengthen review windows, holder swap as a platform operation]

  lingering:
    version: 0
    p: 0.6
    m_decide: 3
    thresholds: {exit_met_hours_gte: 48}
    needs: [registry.mandate_exit]
    delta_m: "owner prompts to the position after its exit x minutes_per_prompt"
    remedies: [close, merge into the permanent owner, formalize with a new mandate]

  inbound-backlog:
    version: 3                   # v3 (2026-11-22): part successor (medium) for a parked position whose successor is held (diagnose.md 2.15); v2 (2026-11-15): a queue under a position's alias is that position's; v1 (2026-11-15): decided by the structure keeper (diagnose.md §1, Who decides), and p from labels (§5.2); v0 (2026-11-06): of.inbound_queue exists from 12:47Z; blocked until queues are observed on 3 days
    labels_carry_from: [0, 1, 2] # v1 changes only the decider; v2 reads an alias's queue as its position's; v3 adds a part and narrows unattended by it
    decider: unit_owner_or_structure_keeper   # of_architect, 2026-11-15 (relay msg 01a1dc76-ed6e): the structure keeper, or the unit owner inside a delegated unit (of_diagnose.EITHER)
    p: 0.95   # 2026-11-15: 5 of 5 distinct labelled judgements true, held under certainty (diagnose.md §5.2); was 0.5
    m_decide: 5
    thresholds: {queue_observed_days_gte: 3, old_after_min: 30, backlog_min_per_day_gte: 60, overload_days_gte: 3, depth_avg_gte: 2, unattended_days_gte: 2, exclude_kinds: [owner], merge_into: bottleneck-broker}
    severity: {overload: medium, unattended: high, successor: medium}   # successor: its unit owner or structure keeper moves the queue to a named, held successor, so a delegated unit's issue.severity >= high does not take it to the owner
    needs: [of.inbound_queue]
    delta_m: "0 unless the owner relays around the queue (ap.owner-relay); dT: sender waiting hours removed"
    remedies: {overload: [deputy or published interface for its most frequent request, keepers decide routine within their grants], unattended: [route senders to the successor or unit owner, give the position a holder], successor: [the unit owner or structure keeper moves the queue to the successor (of inbox move), drop a stale message (of inbox drop)]}

  # ---- development-loop rules (RFC 0005 §6; diagnose.md 2.16-2.22, 2.28). v0 (2026-11-07): proposal, blocked until the loop
  # projection of diagnose.md 4.1 exists. Per work, affected [<work>]. The first remedy is a pulse nudge to the doer.
  loop-cheapest-rung:
    version: 0
    p: 0.6
    m_decide: 2
    thresholds: {skipped_runs_gte: 2}
    needs: [registry.works.loop, of.loop_run]   # runs name their hypothesis; it may be recorded before the window
    decider: doer
    severity: low
    delta_m: "0 (frees runner hours: the skipped rung's cost difference)"
    remedies: ["nudge: run it on the cheaper rung first", add the missing cheap rung to the ladder]

  loop-checkpoint:
    version: 0
    p: 0.6
    m_decide: 5
    thresholds: {checkpoint_days_default: 3}
    needs: [registry.works.loop, of.loop_run]
    decider: work_owner
    severity: medium
    delta_m: "0; dT: target.stake per day x days without a production signal (cost of delay)"
    remedies: ["nudge: what goes to shadow next", put the best kept hypothesis behind a flag in shadow on one site]

  loop-plateau:
    version: 2                   # v2 (2026-11-15): nor is an unlocated run (hand-over 7b8db7d4); v1 (2026-11-14): a run on a proxy not shown to hold is no cycle (diagnose.md 2.18, 2.28)
    labels_carry_from: [1]       # v2 only narrows what fires
    p: 0.6
    m_decide: 10
    thresholds: {cycles_gte: 3, gain_share_lt: 0.01}
    needs: [registry.works.loop, of.loop_run]
    decider: work_owner
    severity: medium
    delta_m: "0; dT: the stake the loop no longer moves"
    remedies: [step back and reframe (double loop), reframe review by a second position the unit owner names]

  loop-wip:
    version: 1                   # v1 (2026-11-23): each cell, or rung of a wip_arms map, against its own limit (hand-over c4ef8758)
    labels_carry_from: [0]       # v1 only narrows what fires on a v0 loop (a whole number, no cells)
    p: 0.6
    m_decide: 2
    thresholds: {wip_arms_default: 2, over_hours_gte: 12}
    needs: [registry.works.loop]   # arms in flight come from the projection's series, whenever they started
    decider: doer
    severity: low
    delta_m: "0 (shorter cycle time per arm)"
    remedies: ["nudge: finish or park one arm"]

  loop-babysit-model:
    version: 0
    p: 0.6
    m_decide: 2
    thresholds: {calls_gte: 100, babysit_model_default: sonnet, model_rank: [haiku, sonnet, opus, fable]}
    needs: [registry.works.loop, of.mandate_check]   # with command_class (diagnose.md 4.1), not recorded yet
    decider: doer                # with of_capacity, who routes models (RFC 0005 §8 step 5)
    severity: low
    delta_m: "0; dT: the model cost difference on the runner and monitor calls"
    remedies: [route runner commands and monitors to a subagent or session on babysit_model]

  loop-objective-drift:
    version: 2                   # v1 (2026-11-12): part context, hand-over 9e2140b6 (docs/registry.md Works, segment)
                                 # v2 (2026-11-14): part untied, the owner's measure, hand-over 95bf514e (docs/registry.md Works)
    p: {unpriced: 0.6, untied: 0.6, context: 0.6}
    m_decide: {unpriced: 5, untied: 5, context: 5}
    thresholds: {unpriced_runs_gte: 3, unpriced_share_gte: 0.30}   # also untied's; a change_objective without its basis, or one context hit, fires at once
    needs: [registry.works.loop, of.loop_run]
    reads: [of.loop_hypothesis, of.loop_decision]
    decider: work_owner
    severity: medium
    delta_m: "0; dT: runs spent on a proxy with no proven price or no tie to the owner's measure, or on a part the organization does not control"
    remedies:
      unpriced: ["price the metric in the target's money (measures.to_money) before more work on it", return to the target metric]
      untied: ["tie the metric to the target the owner decided (measures.to_target), or return to the target metric",
               "get the owner's yes on a new measure: the structure keeper rewrites the target and its decided in the registry"]
      context: ["report the part beside the target, and move the work inside the segment: a lever on a time or a rule between its start and end",
                "restate a hypothesis about the part to the owner as an inference, never a finding"]

  loop-eval-bottleneck:
    version: 1                   # v1 (2026-11-23): rung_runs_gte counts the runs with a queue time (wait_runs), hand-over 0985ab73
    labels_carry_from: [0]       # v1 only narrows what fires
    p: 0.6
    m_decide: 5
    thresholds: {wait_share_gt: 0.40, rung_runs_gte: 3}   # rung_runs_gte: runs the share is read from
    needs: [registry.works.loop, of.loop_run]
    decider: work_owner
    severity: medium
    delta_m: "0; dT: the wait hours on the rung"
    remedies: [elevate the rung (more runners), move hypotheses to a cheaper rung, schedule work around the rung]

  loop-observed-elsewhere:       # diagnose.md 2.28; v0 (2026-11-14): hand-over e640ea57 (RFC 0005 §4.3, §6 rule 8)
    version: 1                   # v1 (2026-11-15): an unlocated run decides nothing either; a locate counts from its own time (hand-over 7b8db7d4)
    labels_carry_from: [0]       # a proxy not shown to hold is judged as in v0
    p: {decision: 0.6, accepted: 0.6}
    m_decide: {decision: 5, accepted: 2}
    thresholds: {}               # one keep or drop resting only on runs that decide nothing, or one accepted run among them, fires at once
    needs:                       # from v1 an unlocated run is judged, never a reason to block
      decision: [registry.works.loop, of.loop_decision]
      accepted: [registry.works.loop, of.loop_run]
    decider: doer
    severity: {decision: medium, accepted: low}
    delta_m: "0; dT: the work a keep or a drop moved on a reading that does not stand for its event"
    remedies:
      decision: ["reopen the hypothesis, and report its reading as not observed where the event happens, labelled as a proxy",
                 "run it where the event happens, or on the data where the proxy's condition held, before a keep or a drop"]
      accepted: ["record no accept on a proxy not shown to hold: report it as not observed where the event happens",
                 "rerun it on the data where the proxy's condition held, which counts as taken there"]

  loop-stalled:                  # diagnose.md 2.29; v0 (2026-11-16): the founder's prompt 01a1e116-e3de, relayed by of_conductor (message 01a1e117-3301)
    version: 0
    p: {silent: 0.6, wait_over: 0.6, calendar: 0.6}
    m_decide: {silent: 2, wait_over: 2, calendar: 3}
    # the hours are of_conductor's proposal on that prompt ("not even 2 days ... two days is also long"), unconfirmed;
    # calendar_kinds: waits that hold no clock (a date the design fixes, such as a locked week or a test of 14 days; held-out data not there yet)
    thresholds: {stall_hours_gte: 4, escalate_hours_gte: 8, calendar_kinds: [calendar, holdout]}
    needs: [registry.works.loop] # never an event in the window: a stall longer than the window is the worst case
    reads: [of.loop_hypothesis, of.loop_run, of.loop_decision, of.loop_wait]
    decider: work_owner          # the pulse tells the owner and the doers at stall_hours_gte, the conductor (the founder's window) at escalate_hours_gte
    severity: {silent: medium, wait_over: medium, calendar: medium}
    delta_m: "0; dT: the hours the work stood with nobody knowing why"
    remedies:
      silent: ["run the hypothesis in testing, decide it, or state what it waits on and by when (of loop wait)"]
      wait_over: ["the stated wait passed: run, decide, or state the new wait and why the first one slipped"]
      calendar: ["start a hypothesis on a cheaper rung meanwhile, or park the work by the owner's decision until the date"]

