apiVersion: v1
kind: Service
metadata:
  name: {{ include "of-server.name" . }}
  labels: {{- include "of-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "of-server.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
