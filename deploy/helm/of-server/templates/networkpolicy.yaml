{{- if .Values.networkPolicy.enabled }}
{{- /* Who may reach the server names pods, never a whole namespace: an entry with a namespaceSelector alone, or with
an empty podSelector, admits every pod of that namespace (2026-11-14, the founder: other containers must not reach the
server or the database; the empty selector, of_secrets-review on organic-framework PR 169). */}}
{{- range .Values.networkPolicy.ingressFrom }}
{{- if not (or (hasKey . "ipBlock") (dig "podSelector" "matchLabels" (dict) .) (dig "podSelector" "matchExpressions" (list) .)) }}
{{- fail "networkPolicy.ingressFrom: each entry needs a podSelector with matchLabels or matchExpressions (the connector's or the ingress controller's pod labels) or an ipBlock; a namespaceSelector alone, or with an empty podSelector, admits every pod of that namespace" }}
{{- end }}
{{- end }}
{{- if not .Values.networkPolicy.dnsTo }}
{{- fail "networkPolicy.dnsTo: name the cluster's DNS pods" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "of-server.name" . }}
  labels: {{- include "of-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "of-server.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - {port: 18200, protocol: TCP}
  egress:
    - to: {{- toYaml .Values.networkPolicy.clickhouseTo | nindent 8 }}
      ports:
        - {port: {{ .Values.networkPolicy.clickhousePort }}, protocol: TCP}
    - to: {{- toYaml .Values.networkPolicy.dnsTo | nindent 8 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- if .Values.grants.gitSync.enabled }}
    - to: {{- toYaml .Values.networkPolicy.gitSyncTo | nindent 8 }}
      ports:   # git-sync to the repository host
        - {port: 22, protocol: TCP}
        - {port: 443, protocol: TCP}
    {{- end }}
{{- end }}
