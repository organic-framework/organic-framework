apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "of-server.name" . }}
  labels: {{- include "of-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # the queue holds acknowledged batches: never delete it with the release
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
