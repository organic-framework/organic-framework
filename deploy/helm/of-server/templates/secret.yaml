{{- if and (not .Values.existingSecret) .Values.secretValues }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "of-server.secretName" . }}
  labels: {{- include "of-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretValues }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
