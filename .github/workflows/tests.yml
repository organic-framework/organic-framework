# The unit suite on every pull request to main, on GitHub's runners and never on a laptop (AGENTS.md: test suites
# run remotely or in CI). Before this workflow every position ran the whole suite on the founder's Mac before naming
# a commit; on 2026-11-15 those runs were part of the load when the hooks fell behind (of_platform, message
# 01a1dc96-33b9). The suite is pure logic: tests/isolate.py gives it a temporary HOME with no organization, no git
# config and no SSH agent, so the log names no organization, person or host. The run only reads the repository.
# Actions are pinned by commit; the tag is in the comment. Owner: of_release.
name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request's branch makes its older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.14"
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Unit suite
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          OF_AUTOMATION: "1"
        run: python3 -m unittest discover -s tests -t .
