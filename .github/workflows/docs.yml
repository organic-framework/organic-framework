# The docs site (site/, Starlight), built from the repository's own Markdown and published to this repository's
# GitHub Pages; built here and never on the founder's Mac. Each run builds it and checks its pages and links; it is
# published only while the repository variable DOCS_SITE is `publish`, set on the founder's yes to the site (ask
# 444bd026, 2026-11-13; publishing it is public). The deploy job waits in the github-pages environment, which
# requires an approval: of_release runs the pre-publish gate over that run's built site (release/check.py --site, in
# the OF team's own repository) and approves the deploy only when it passes. The site's address and the edit links
# come from this repository (actions/configure-pages), so a fork publishes its own. Actions are pinned by commit;
# the tag is in the comment. Owner: of_docs.
name: docs site

on:
  # Every push to main that changes a page's source (the files site/scripts/sync.py reads), the site or this file;
  # and by hand.
  push:
    branches: [main]
    paths:
      - README.md
      - INSTALL.md
      - FEATURES.md
      - CHANGELOG.md
      - docs/**
      - site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Least privilege per job: the build, which runs npm, can only read; only the deploy job can write to Pages.
permissions:
  contents: read

# One run at a time, never cancelled: a run whose deploy waits for its approval holds the group, and of the runs
# pushes start meanwhile only the newest waits (GitHub cancels an older one still pending).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # actions/configure-pages reads the Pages site's address
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # no token left in .git/config while npm and the build run
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 24
      - id: pages
        if: vars.DOCS_SITE == 'publish'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - name: Check the pages and their links
        run: python3 site/scripts/sync.py --check
      - name: Install exactly what site/package-lock.json pins, running no package's install scripts
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Build
        working-directory: site
        env:
          OF_SITE: ${{ steps.pages.outputs.origin || format('https://{0}.github.io', github.repository_owner) }}
          OF_SITE_BASE: ${{ steps.pages.outputs.base_path }}   # empty when not publishing: a preview at the root
          OF_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          OF_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: vars.DOCS_SITE == 'publish'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write   # GitHub Pages deploys with the job's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
