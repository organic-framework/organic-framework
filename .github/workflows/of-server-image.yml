# The of-server image (deploy/Dockerfile; docs/server.md, profile 2), built here and never on a laptop. It goes to
# the framework's own registry, ghcr.io/organic-framework/of-server. This workflow names no organization's account:
# in a public repository a step's environment, repository variables included, is printed in public logs. An
# organization that runs the server copies the image by digest into its own registry, or builds it from a pinned
# commit, in its own CI (deploy/RUNBOOK.md section 3). Owner: of_server.
#
# A pull request builds and checks the image but never logs in or pushes. After a push to main, a separate job with
# read-only rights scans the pushed digest (Trivy, pinned by its release checksum), so the digest and its scan result
# are in one run for the organizations that copy it (2026-11-12: a user organization's scanner found a KEV entry).
name: of-server image

on:
  push:
    branches: [main]
    paths: ["bin/**", "deploy/Dockerfile", "deploy/copied_sbom.py", "docs/diagnose-v0.yaml",
            ".github/workflows/of-server-image.yml"]
  pull_request:
    paths: ["bin/**", "deploy/Dockerfile", "deploy/copied_sbom.py", "docs/diagnose-v0.yaml",
            ".github/workflows/of-server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: of-server:ci
      - name: The build stage that holds openssh-client, from the same build's cache (the checks below read its dpkg records)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: keygen
          load: true
          tags: of-keygen:ci
      - name: Every module the image holds imports, so every module they import at load is in it; pip is gone
        run: |
          docker run --rm --entrypoint python3 of-server:ci -c \
            "import glob, importlib, os; ms = sorted(os.path.basename(f)[:-3] for f in glob.glob('/app/of_*.py')); [importlib.import_module(m) for m in ms]; print('imports ok:', len(ms))"
          docker run --rm --entrypoint python3 of-server:ci -c \
            "import importlib.util, sys; sys.exit('pip is in the image' if importlib.util.find_spec('pip') else 0)"
      - name: The copied OpenSSH files are the ones the build stage's dpkg lists; no OpenSSH package (deploy/copied_sbom.py)
        run: |
          docker run --rm --entrypoint python3 of-keygen:ci -I /of-build/copied_sbom.py verify --stage | tee stage.txt
          docker run --rm -v "$PWD/deploy/copied_sbom.py:/tmp/copied_sbom.py:ro" --entrypoint python3 of-server:ci \
            -I /tmp/copied_sbom.py verify --final | tee final.txt
          [ "$(tail -n 1 stage.txt)" = "$(tail -n 1 final.txt)" ] || { echo "the image's SBOM is not the build stage's"; exit 1; }
      - name: Trivy reads the SBOM, so scanners see openssh-client and its version
        run: |
          curl -fsSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          docker run --rm --entrypoint cat of-server:ci /usr/share/of-server/sbom/ssh-keygen.cdx.json > sbom.json
          ./trivy image --quiet --format cyclonedx --output trivy.cdx.json of-server:ci
          python3 -I deploy/copied_sbom.py seen --sbom sbom.json --report trivy.cdx.json
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' bin/of_server.py)
          for tag in "${GITHUB_SHA::12}" "$VERSION" main; do
            docker tag of-server:ci "ghcr.io/organic-framework/of-server:$tag"
            docker push "ghcr.io/organic-framework/of-server:$tag"
          done
          # The registry's digest, never RepoDigests' first entry: that can be the local name of-server@sha256:…,
          # which the scan then looks up on Docker Hub (run 43173141870).
          DIGEST=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "ghcr.io/organic-framework/of-server:${GITHUB_SHA::12}" | grep -m1 '^ghcr\.io/organic-framework/of-server@sha256:' || true)
          [ -n "$DIGEST" ] || { echo "no ghcr.io digest for the pushed image"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$DIGEST\` (tags ${GITHUB_SHA::12}, $VERSION, main)" >> "$GITHUB_STEP_SUMMARY"

  scan:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy 0.76.1, checked against the checksum in its release
        run: |
          curl -fsSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
      - name: Scan the pushed digest (high and critical; the table is the scan result to hand on with the digest)
        env:
          IMAGE: ${{ needs.image.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          case "$IMAGE" in ghcr.io/organic-framework/of-server@sha256:*) ;; *) echo "not a ghcr.io digest: $IMAGE"; exit 1;; esac
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --format table "$IMAGE" | tee scan.txt
          { echo "### Scan of \`$IMAGE\` (Trivy 0.76.1, high and critical)"; echo '```'; cat scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
