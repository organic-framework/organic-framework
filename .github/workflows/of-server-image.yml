# The of-server image (deploy/Dockerfile; docs/server.md, profile 2), built here and never on a laptop. It goes to
# the framework's own registry, ghcr.io/organic-framework/of-server. This workflow names no organization's account:
# in a public repository a step's environment, repository variables included, is printed in public logs. An
# organization that runs the server copies the image by digest into its own registry, or builds it from a pinned
# commit, in its own CI (deploy/RUNBOOK.md section 3). Owner: of_server.
name: of-server image

on:
  push:
    branches: [main]
    paths: ["bin/**", "deploy/Dockerfile", "docs/diagnose-v0.yaml", ".github/workflows/of-server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: of-server:ci
      - name: Every module the image holds imports, so every module they import at load is in it
        run: |
          docker run --rm --entrypoint python3 of-server:ci -c \
            "import glob, importlib, os; ms = sorted(os.path.basename(f)[:-3] for f in glob.glob('/app/of_*.py')); [importlib.import_module(m) for m in ms]; print('imports ok:', len(ms))"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' bin/of_server.py)
          for tag in "${GITHUB_SHA::12}" "$VERSION" main; do
            docker tag of-server:ci "ghcr.io/organic-framework/of-server:$tag"
            docker push "ghcr.io/organic-framework/of-server:$tag"
          done
